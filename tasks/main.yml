---
- name: Assert
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Install Root CA certificate files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/usr/local/share/ca-certificates/{{ item.key }}.crt"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _install_root_ca_certs_certificates | dict2items }}"
  register: new_certs_installed
  loop_control:
    label: "{{ item.key }}"
  notify: Update Root CA certificate database

- name: Add certificate locations to glob file
  ansible.builtin.lineinfile:
    dest: "{{ _install_root_ca_certs_glob_file }}"
    owner: root
    group: root
    mode: "0644"
    create: true
    line: "/usr/local/share/ca-certificates/{{ item.key }}.crt"
  loop: "{{ _install_root_ca_certs_certificates | dict2items }}"
  when: _install_root_ca_certs_glob_file | length > 0
  loop_control:
    label: "{{ item.key }}"
