---
# defaults file for ansible-role-install_root_ca_certs

# File that lists the installed certificate paths, one per line (read by certificate expiry checks);
# "" skips it
_install_root_ca_certs_glob_file: /etc/cert_exp_time_globs

# CA certificates to trust, as {<file name without .crt>: <PEM certificate>}; each one goes to
# /usr/local/share/ca-certificates/<name>.crt
_install_root_ca_certs_certificates: {}
